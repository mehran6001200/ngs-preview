name: Build A26 Female Voice APK
on:
  push:
    branches: [ a26-female-voice ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A26_FemaleVoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: A26-FemaleVoice-debug-APK
          path: A26_FemaleVoice/app/build/outputs/apk/debug/app-debug.apk
