name: A26 PR Build
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'A26_FemaleVoice/**'
      - '.github/workflows/a26-pr-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A26_FemaleVoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch formant-aware DSP library
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/TarsosDSPKit-release.aar https://raw.githubusercontent.com/koendv/TarsosDSPKit/master/binaries/TarsosDSPKit-release.aar
          ls -lh app/libs/TarsosDSPKit-release.aar
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: A26-FemaleVoice-debug-APK
          path: A26_FemaleVoice/app/build/outputs/apk/debug/app-debug.apk
