name: Deploy NamiWin AKPA PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/akpa-app
          cp -f index.html _site/index.html || true
          cp -f style.css _site/style.css || true
          cp -f logo.png _site/logo.png || true
          unzip -o akpa-app.zip -d _site/akpa-app
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
