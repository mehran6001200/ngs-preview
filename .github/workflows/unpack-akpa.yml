name: Unpack NamiWin AKPA PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Unpack PWA
        run: |
          rm -rf akpa-app
          mkdir -p akpa-app
          unzip -o akpa-app.zip -d akpa-app
      - name: Commit unpacked app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add akpa-app
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Publish NamiWin AKPA PWA files [skip ci]'
            git push
          fi
